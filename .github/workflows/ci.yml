name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev,docs]"
      - name: Ruff
        run: ruff check src tests benchmarks
      - name: Docs links
        run: python -m pytest tests/test_docs.py -q
      - name: Build docs site
        run: mkdocs build --site-dir _site

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Build native parser
        run: bash scripts/build_native.sh
      - name: Rust tests
        run: cargo test --workspace
      - name: Conformance and native tests
        run: python -m pytest tests/test_conformance.py tests/test_native_backend.py -q
      - name: Benchmark smoke test
        run: python benchmarks/parse_bench.py --lines 300 --repeat 2

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Coverage gate
        if: matrix.python-version == '3.12'
        run: python -m pytest -q --cov --cov-report=term-missing --cov-fail-under=43

  cross-platform:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Test (excluding Tk GUI)
        run: python -m pytest -q -k "not studio_gui"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install release tooling
        run: python -m pip install --upgrade pip && pip install -e ".[release]"
      - name: Build sdist and wheel
        run: python -m build
      - name: Check metadata
        run: twine check dist/*
      - name: Verify wheel contents
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert any("ide/samples/aurora/samples/" in n for n in names), "Aurora sample missing"
          print("wheel OK:", wheel)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
