[package]
name = "parsercraft-cli"
description = "Command-line front end for the ParserCraft Rust core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "parsercraft-rs"
path = "src/main.rs"

[dependencies]
parsercraft-core = { path = "../parsercraft-core", default-features = false }
serde_json = "1"
