name: Aurora
version: "1.0.0"
description: "A small, expressive teaching language built with Lashon."
author: "Lashon Studio"
target_interpreter: python

keywords:
  if: "if"
  else: "else"
  while: "while"
  fn: "fn"
  return: "return"
  print: "print"
  "true": "true"
  "false": "false"

syntax_options:
  single_line_comment: "//"
  require_semicolons: true
  statement_terminator: ";"

grammar:
  start: program
  skip_whitespace: true
  comments:
    - "//.*"
  rules:
    program: "statement+"
    statement: "function_def / if_stmt / while_stmt / return_stmt / print_stmt / assignment / expr_stmt"
    function_def: "'fn' IDENT '(' param_list? ')' block"
    block: "'{' statement* '}'"
    param_list: "IDENT (',' IDENT)*"
    if_stmt: "'if' comparison block ('else' block)?"
    while_stmt: "'while' comparison block"
    return_stmt: "'return' expr ';'"
    print_stmt: "'print' expr ';'"
    assignment: "IDENT '=' expr ';'"
    expr_stmt: "call ';'"
    comparison: "expr ('==' / '!=' / '<=' / '>=' / '<' / '>') expr"
    expr: "term (('+' / '-') term)*"
    term: "factor (('*' / '/' / '%') factor)*"
    factor: "call / NUMBER / STRING / boolean / IDENT / '(' expr ')'"
    call: "IDENT '(' arg_list? ')'"
    arg_list: "expr (',' expr)*"
    boolean: "'true' / 'false'"
