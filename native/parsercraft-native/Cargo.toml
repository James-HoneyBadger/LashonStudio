[package]
name = "parsercraft-native"
version = "0.1.0"
edition = "2021"
description = "Experimental PEG engine for ParserCraft (PyO3 extension)"
license = "MIT"

[lib]
name = "parsercraft_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.26", features = ["extension-module"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
