[package]
name = "parsercraft-core"
description = "PEG grammar engine for ParserCraft (Rust core + Python bindings)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "parsercraft_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.26", features = ["extension-module", "abi3-py310"], optional = true }
serde_json = "1"

[features]
default = []
python = ["dep:pyo3"]
