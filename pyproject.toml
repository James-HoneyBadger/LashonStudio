[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ParserCraft"
description = "Lashon Studio - custom programming language construction: PEG grammars, AST, Python/C/WASM/LLVM backends"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "James HoneyBadger" }]
keywords = ["peg", "parser", "compiler", "language", "codegen", "ast"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["PyYAML>=6.0"]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
    "wasmtime>=50.0",
]
release = [
    "build>=1.2",
    "twine>=5.0",
]
docs = [
    "mkdocs-material>=9.5",
]

[project.urls]
Homepage = "https://github.com/James-HoneyBadger/LashonStudio"
Repository = "https://github.com/James-HoneyBadger/LashonStudio"
Issues = "https://github.com/James-HoneyBadger/LashonStudio/issues"
Documentation = "https://james-honeybadger.github.io/LashonStudio/"

[project.scripts]
lashon = "lashon.tooling.cli:main"
lashon-ide = "lashon.ide.app:main"
lashon-repl = "lashon.ide.repl_app:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["lashon*", "parsercraft*"]
namespaces = false
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "lashon.__version__" }

[tool.setuptools.package-data]
lashon = ["*.json", "*.yaml"]
"lashon.ide" = [
    "samples/aurora/*.yaml",
    "samples/aurora/*.peg",
    "samples/aurora/*.md",
    "samples/aurora/samples/*.aur",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["src/lashon"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
omit = [
    "*/tests/*",
    "*/__main__.py",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
